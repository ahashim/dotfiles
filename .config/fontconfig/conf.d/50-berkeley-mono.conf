<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Only Regular gets spacing=mono from autodetection; kitty ignores non-mono faces -->
  <match target="scan">
    <test name="family"><string>Berkeley Mono</string></test>
    <edit name="spacing"><const>mono</const></edit>
  </match>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Berkeley Mono</family></prefer>
  </alias>
</fontconfig>
