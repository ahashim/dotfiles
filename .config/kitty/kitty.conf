# general
allow_remote_control		yes
background_opacity     		0.9
cursor_blink_interval       	0.5
cursor_trail 			1
confirm_os_window_close 	0
dynamic_background_opacity  	yes
enable_audio_bell           	no
hide_window_decorations     	yes
window_padding_width 		10

# fonts
font_size              		12.0
font_family            		postscript_name=BerkeleyMono-Regular
bold_font              		postscript_name=BerkeleyMono-Bold
italic_font            		postscript_name=BerkeleyMono-Oblique
bold_italic_font       		postscript_name=BerkeleyMono-BoldOblique
symbol_map             		U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono
modify_font            		cell_height 105%
text_composition_strategy 		1.2 10
font_features          		BerkeleyMono-Regular +ss05 +ss06
font_features          		BerkeleyMono-Bold +ss05 +ss06
font_features          		BerkeleyMono-Oblique +ss05 +ss06
font_features          		BerkeleyMono-BoldOblique +ss05 +ss06

# layout
enabled_layouts        		splits:split_axis=horizontal
map                    		kitty_mod+t       new_tab_with_cwd
map                    		cmd+t             new_tab_with_cwd
map                    		f4                launch --type=tab --cwd=~
map                    		f5                launch --location=hsplit --cwd=current
map                    		f6                launch --location=hsplit
map                    		f7                launch --location=vsplit --cwd=current
map                    		f8                launch --location=vsplit
map                    		f9                layout_action rotate
map                    		shift+up          move_window up
map                    		shift+left        move_window left
map                    		shift+right       move_window right
map                    		shift+down        move_window down
map                    		alt+h             neighboring_window left
map                    		alt+l             neighboring_window right
map                    		alt+k             neighboring_window up
map                    		alt+j             neighboring_window down
map                    		ctrl+shift+k      resize_window taller
map                    		ctrl+shift+h      resize_window narrower
map                    		ctrl+shift+l      resize_window wider
map                    		ctrl+shift+j      resize_window shorter
map                    		ctrl+shift+end    resize_window reset

# theme
include themes/cyberdream.conf
